# Hébergement de test du site 2026 chez Netlify, à brancher sur le dépôt GitHub
# Hilarious/Hilarious_Website. Netlify compile le site à chaque push et publie out/.
# La consigne de non indexation est envoyée par le serveur sur toutes les pages :
# à retirer, avec SITE_INDEXABLE=true, uniquement le jour de la bascule sur hilarious.be.

[build]
  base = "source"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
